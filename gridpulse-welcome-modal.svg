<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1322"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Modal Background -->
    <linearGradient id="modalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Callout Box Gradient -->
    <linearGradient id="calloutGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082b38"/>
      <stop offset="100%" stop-color="#051f28"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- BACKGROUND: DASHBOARD BACKDROP (SIMULATED BLURRED CONSOLE) -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>
  
  <!-- Subtle background grid lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="200" y1="0" x2="200" y2="850"/>
    <line x1="400" y1="0" x2="400" y2="850"/>
    <line x1="600" y1="0" x2="600" y2="850"/>
    <line x1="800" y1="0" x2="800" y2="850"/>
    <line x1="1000" y1="0" x2="1000" y2="850"/>
  </g>

  <!-- Blurred Mock Background Header -->
  <g opacity="0.25" class="font-sans">
    <rect x="30" y="20" width="1140" height="50" rx="8" fill="#1e293b"/>
    <circle cx="55" cy="45" r="10" fill="#06b6d4"/>
    <rect x="75" y="38" width="160" height="14" rx="4" fill="#64748b"/>
    <rect x="250" y="38" width="100" height="14" rx="4" fill="#0284c7"/>
    <rect x="1000" y="38" width="140" height="14" rx="4" fill="#334155"/>
  </g>

  <!-- Blurred Mock Background Cards -->
  <g opacity="0.22">
    <rect x="30" y="90" width="1140" height="120" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="30" y="230" width="360" height="180" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="420" y="230" width="360" height="180" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="810" y="230" width="360" height="180" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="30" y="430" width="560" height="140" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="610" y="430" width="560" height="140" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="30" y="590" width="1140" height="120" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- DARK MODAL OVERLAY BACKDROP -->
  <rect width="1200" height="850" fill="#000000" opacity="0.76"/>

  <!-- ==================== WELCOME MODAL CONTAINER ==================== -->
  <g transform="translate(235, 45)" filter="url(#modalShadow)" class="font-sans">
    <!-- Modal Base Card -->
    <rect width="730" height="760" rx="14" fill="url(#modalBg)" stroke="#334155" stroke-width="1.2"/>

    <!--  MODAL HEADER  -->
    <rect width="730" height="76" rx="14" fill="#020617"/>
    <rect y="64" width="730" height="12" fill="#020617"/>
    <line x1="0" y1="76" x2="730" y2="76" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Compass Icon Container -->
    <rect x="24" y="18" width="40" height="40" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1.2"/>
    <!-- Compass Vector -->
    <g transform="translate(44, 38)" stroke="#38bdf8" stroke-width="2" fill="none">
      <circle cx="0" cy="0" r="12"/>
      <polygon points="0,-8 5,0 0,8 -5,0" fill="#38bdf8" stroke="none"/>
      <circle cx="0" cy="0" r="2" fill="#082f49"/>
    </g>

    <!-- Header Text -->
    <text x="76" y="37" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="0.2">Welcome to GridPulse 330</text>
    <text x="76" y="55" font-size="12" font-weight="400" fill="#94a3b8">
      Designed &amp; Engineered by <tspan fill="#38bdf8" font-weight="600">Samuel Peter</tspan> • Critical Infrastructure DevOps
    </text>

    <!-- Close Button (X) -->
    <rect x="674" y="22" width="32" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <g transform="translate(684, 32)" stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="0" x2="12" y2="12"/>
      <line x1="12" y1="0" x2="0" y2="12"/>
    </g>

    <!--  MODAL BODY CONTENT  -->

    <!-- Section 1: What This App Does (Callout Box) -->
    <g transform="translate(24, 94)">
      <rect width="682" height="88" rx="8" fill="url(#calloutGrad)" stroke="#0e7490" stroke-width="1"/>
      <text x="16" y="24" font-size="11" font-weight="700" fill="#67e8f9" letter-spacing="0.8">WHAT THIS APP DOES</text>
      <text x="16" y="46" font-size="12.5" fill="#e2e8f0" font-weight="400">
        <tspan x="16" dy="0">GridPulse 330 is an interactive DevOps Power Grid Telemetry &amp; Alert Console engineered for National</tspan>
        <tspan x="16" dy="18">Control Centers. It models the acute physical impacts of rapid, unpredictable weather shifts on</tspan>
        <tspan x="16" dy="18"><tspan font-weight="700" fill="#38bdf8">330 kV transmission lines</tspan> and <tspan font-weight="700" fill="#34d399">50.00 Hz grid frequency</tspan>, alerting operators before blackouts occur.</tspan>
      </text>
    </g>

    <!-- Section 2: Main Features -->
    <g transform="translate(24, 202)">
      <g transform="translate(0, 14)">
        <circle cx="9" cy="9" r="9" fill="#064e3b"/>
        <polyline points="5,9 8,12 14,6" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="26" y="28" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="0.8">MAIN SYSTEM CAPABILITIES</text>

      <!-- Feature 1 -->
      <g transform="translate(0, 44)">
        <circle cx="6" cy="6" r="3.5" fill="#38bdf8"/>
        <text x="18" y="9" font-size="12.5" fill="#cbd5e1">
          <tspan font-weight="700" fill="#f1f5f9">Meteorological Contingency Radar:</tspan> Tracks Clear/Sunny, Cloud Inversion, Gale Gusts,
        </text>
        <text x="18" y="26" font-size="12.5" fill="#94a3b8">and convective Thunderstorms with heavy rainfall and lightning shear in real-time.</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 84)">
        <circle cx="6" cy="6" r="3.5" fill="#38bdf8"/>
        <text x="18" y="9" font-size="12.5" fill="#cbd5e1">
          <tspan font-weight="700" fill="#f1f5f9">Statutory Dual-Threshold Alarms:</tspan> Instant acoustic &amp; visual sirens when 330 kV Bus
        </text>
        <text x="18" y="26" font-size="12.5" fill="#94a3b8">Voltage exceeds <tspan fill="#f87171" font-weight="600">&gt;340.0 kV</tspan> (Ferranti effect) or Frequency breaches <tspan fill="#fbbf24" font-weight="600">&gt;51.00 Hz</tspan> (load rejection).</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 124)">
        <circle cx="6" cy="6" r="3.5" fill="#38bdf8"/>
        <text x="18" y="9" font-size="12.5" fill="#cbd5e1">
          <tspan font-weight="700" fill="#f1f5f9">Cascading Line Protection:</tspan> Real-time monitoring of dual-circuit 330 kV bulk lines
        </text>
        <text x="18" y="26" font-size="12.5" fill="#94a3b8">(Ikeja West – Oshogbo) with ANSI 87L differential protection and thermal N-1 transfers.</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(0, 164)">
        <circle cx="6" cy="6" r="3.5" fill="#38bdf8"/>
        <text x="18" y="9" font-size="12.5" fill="#cbd5e1">
          <tspan font-weight="700" fill="#f1f5f9">Operator Dispatch Action Playbook:</tspan> Closed-loop remedial dispatch controls to
        </text>
        <text x="18" y="26" font-size="12.5" fill="#94a3b8">switch in 150 MVAR Shunt Reactors, fast-deload generation (-400 MW), and auto-reclose.</text>
      </g>
    </g>

    <!-- Section 3: Where to Start (Workflow Box) -->
    <g transform="translate(24, 430)">
      <rect width="682" height="136" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1.2"/>
      
      <!-- Arrow Icon & Title -->
      <g transform="translate(16, 16)" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round">
        <line x1="0" y1="7" x2="12" y2="7"/>
        <polyline points="7,2 12,7 7,12"/>
      </g>
      <text x="36" y="28" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="0.8">QUICK-START OPERATIONAL PLAYBOOK</text>

      <!-- Steps -->
      <g transform="translate(18, 48)" class="font-sans">
        <circle cx="8" cy="8" r="8" fill="#1e293b"/>
        <text x="8" y="11" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">1</text>
        <text x="24" y="12" font-size="12" fill="#cbd5e1">
          Under <tspan font-weight="700" fill="#ffffff">Anticipated Weather</tspan>, select <tspan font-weight="700" fill="#f87171">"Thunderstorm &amp; Heavy Rain"</tspan> and trigger event.
        </text>

        <g transform="translate(0, 26)">
          <circle cx="8" cy="8" r="8" fill="#1e293b"/>
          <text x="8" y="11" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">2</text>
          <text x="24" y="12" font-size="12" fill="#cbd5e1">
            Observe the <tspan font-weight="700" fill="#f87171">&gt;340.0 kV High Voltage</tspan> and <tspan font-weight="700" fill="#fbbf24">&gt;51.00 Hz High Frequency</tspan> sirens fire.
          </text>
        </g>

        <g transform="translate(0, 52)">
          <circle cx="8" cy="8" r="8" fill="#1e293b"/>
          <text x="8" y="11" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">3</text>
          <text x="24" y="12" font-size="12" fill="#cbd5e1">
            Use the <tspan font-weight="700" fill="#38bdf8">Operator Console</tspan> below to switch in the Shunt Reactor &amp; De-Load Generation!
          </text>
        </g>
      </g>
    </g>

    <!-- Technical Credentials Badge Box -->
    <g transform="translate(24, 582)">
      <rect width="682" height="66" rx="8" fill="#091424" stroke="#0f2b48" stroke-width="1"/>
      <text x="16" y="24" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">ENERGY SECTOR DEVOPS &amp; SCADA EMS ARCHITECTURE</text>
      <text x="16" y="44" font-size="11.5" fill="#94a3b8">
        Adheres to Nigerian 330 kV Grid Code statutory operating ceilings and IEEE 1547 / IEC 60870 standards.
      </text>
    </g>

    <!--  MODAL FOOTER  -->
    <line x1="0" y1="670" x2="730" y2="670" stroke="#1e293b" stroke-width="1.2"/>
    <rect y="671" width="730" height="89" rx="14" fill="#020617"/>

    <!-- Left Footer Text -->
    <text x="26" y="722" class="font-mono" font-size="12" fill="#64748b">
      GridPulse 330 • Developed by <tspan fill="#38bdf8">Samuel Peter</tspan>
    </text>

    <!-- Enter Console Button -->
    <g transform="translate(490, 694)" cursor="pointer">
      <rect width="216" height="42" rx="7" fill="url(#btnGrad)" filter="url(#glowCyan)"/>
      <text x="96" y="26" font-size="13" font-weight="700" fill="#041624" text-anchor="middle" letter-spacing="0.4">
        Enter Operator Console
      </text>
      <!-- Arrow vector -->
      <g transform="translate(182, 16)" stroke="#041624" stroke-width="2.5" fill="none" stroke-linecap="round">
        <line x1="0" y1="5" x2="10" y2="5"/>
        <polyline points="6,1 10,5 6,9"/>
      </g>
    </g>
  </g>
</svg>